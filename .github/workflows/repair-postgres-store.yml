name: Repair PostgresStore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair PostgresStore implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/store.ts")
          text = path.read_text()

          if "async adminRevokeDeployment(deploymentId: string)" not in text:
              method = '  async adminRevokeDeployment(deploymentId: string) { const result = await this.pool.query("UPDATE gbolix_deployments SET status=\'revoked\',updated_at=NOW() WHERE id=$1", [deploymentId]); return result.rowCount === 1; }\n'
              pattern = r'(  async revokeDeployment\(deploymentId: string, agentId: string, workspaceId: string\) \{[^\n]*\}\n)'
              text, count = re.subn(pattern, r'\1' + method, text, count=1)
              if count != 1:
                  raise SystemExit("Could not locate PostgresStore.revokeDeployment; refusing to modify src/store.ts")
              path.write_text(text)
              print("Inserted PostgresStore.adminRevokeDeployment")
          else:
              print("adminRevokeDeployment already present")

      - name: Verify TypeScript build
        run: npm install && npm run build

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          if git diff --quiet -- src/store.ts; then
            rm -f .github/workflows/repair-postgres-store.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/repair-postgres-store.yml
            git commit -m "chore: remove temporary repair workflow"
            git push
            exit 0
          fi
          rm -f .github/workflows/repair-postgres-store.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.ts .github/workflows/repair-postgres-store.yml
          git commit -m "fix: implement admin deployment revoke in PostgresStore"
          git push