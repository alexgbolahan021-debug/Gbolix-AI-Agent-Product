name: Apply Gbolix OAuth integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch OAuth integration
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          config = root / 'src/config.ts'
          text = config.read_text()
          old = '  connectionEncryptionKey: process.env.AGENT_CONNECTION_ENCRYPTION_KEY ?? process.env.AGENT_JWT_SECRET,\n'
          new = old + '  hubspotClientId: process.env.HUBSPOT_CLIENT_ID,\n  hubspotClientSecret: process.env.HUBSPOT_CLIENT_SECRET,\n  googleClientId: process.env.GOOGLE_CLIENT_ID,\n  googleClientSecret: process.env.GOOGLE_CLIENT_SECRET,\n'
          if old not in text:
              raise SystemExit('config marker not found')
          config.write_text(text.replace(old, new, 1))

          env = root / '.env.example'
          env_text = env.read_text()
          additions = '\n# Native OAuth providers for Level 3 connections\nHUBSPOT_CLIENT_ID=\nHUBSPOT_CLIENT_SECRET=\nGOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=\n'
          if 'HUBSPOT_CLIENT_ID=' not in env_text:
              env.write_text(env_text.rstrip() + additions)

          server = root / 'src/server.ts'
          text = server.read_text()
          import_marker = 'import { createStore, hash } from "./store.js";\n'
          import_add = import_marker + 'import { callbackPage, completeOAuth, createAuthorizationUrl, oauthConfigured, type OAuthProvider } from "./oauth.js";\n'
          if import_add not in text:
              if import_marker not in text:
                  raise SystemExit('server import marker not found')
              text = text.replace(import_marker, import_add, 1)

          route_marker = 'app.delete("/v1/agents/:agentId/deployments/:deploymentId", withIdentity(async (request, response, identity) => { const removed = await store.revokeDeployment(String(request.params.deploymentId), String(request.params.agentId), identity.workspaceId); return removed ? response.status(204).send() : response.status(404).json({ error: "Deployment not found" }); }));\n'
          oauth_routes = route_marker + '''\napp.get("/v1/agents/:agentId/connections/oauth/:provider/start", withIdentity(async (request, response, identity) => {\n  const provider = String(request.params.provider) as OAuthProvider;\n  if (!["hubspot", "google_gmail", "google_calendar"].includes(provider)) return response.status(400).json({ error: "Unsupported OAuth provider" });\n  const agent = await store.getAgent(String(request.params.agentId));\n  if (!agent || agent.workspaceId !== identity.workspaceId) return response.status(404).json({ error: "Agent not found" });\n  if (agent.level < 3) return response.status(402).json({ error: "Level 3 is required to connect tools and external systems.", code: "LEVEL_REQUIRED", level: 3 });\n  if (!oauthConfigured(provider)) return response.status(503).json({ error: `${provider} OAuth is not configured on the server.`, code: "OAUTH_PROVIDER_NOT_CONFIGURED" });\n  const redirectUri = `${publicBaseUrl(request)}/v1/oauth/${provider}/callback`;\n  return response.json({ provider, authorizationUrl: createAuthorizationUrl(provider, agent.id, identity.workspaceId, redirectUri), redirectUri });\n}));\n\nfor (const provider of ["hubspot", "google_gmail", "google_calendar"] as const) {\n  app.get(`/v1/oauth/${provider}/callback`, async (request, response) => {\n    try {\n      const error = typeof request.query.error === "string" ? request.query.error : undefined;\n      if (error) return response.status(400).type("html").send(callbackPage(false, `Authorization was not completed: ${error}`));\n      const code = typeof request.query.code === "string" ? request.query.code : "";\n      const state = typeof request.query.state === "string" ? request.query.state : "";\n      if (!code || !state) return response.status(400).type("html").send(callbackPage(false, "The OAuth callback was missing the authorization code or state."));\n      const redirectUri = `${publicBaseUrl(request)}/v1/oauth/${provider}/callback`;\n      await completeOAuth(store, code, state, redirectUri);\n      return response.type("html").send(callbackPage(true, "The connection is now active. You can close this window and return to Gbolix."));\n    } catch (error) {\n      const message = error instanceof Error ? error.message : "Unable to complete the OAuth connection.";\n      return response.status(400).type("html").send(callbackPage(false, message));\n    }\n  });\n}\n'''
          if 'connections/oauth/:provider/start' not in text:
              if route_marker not in text:
                  raise SystemExit('server route marker not found')
              text = text.replace(route_marker, oauth_routes, 1)
          server.write_text(text)

          # Remove the temporary patch artifacts after this workflow has applied the real changes.
          temporary = root / 'scripts/implement-oauth.py'
          if temporary.exists():
              temporary.unlink()
          workflow = root / '.github/workflows/apply-oauth.yml'
          if workflow.exists():
              workflow.unlink()

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit applied integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.ts src/oauth.ts src/server.ts .env.example scripts/implement-oauth.py .github/workflows/apply-oauth.yml
          git diff --cached --quiet || git commit -m 'Implement HubSpot and Google OAuth connections'
          git push
