services:
  - type: web
    name: gbolix-ai-agent-engine
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_PROVIDER_ORDER
        value: gemini,openai
      - key: AI_FALLBACK_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_DEFAULT_MODEL
        value: gpt-5-mini
      - key: DEFAULT_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gbolix-ai-agent-db
          property: connectionString
      - key: ALLOW_MEMORY_STORAGE
        value: "false"
      - key: CREDIT_MODE
        value: platform
      - key: GBOLIX_PLATFORM_URL
        sync: false
      - key: GBOLIX_PLATFORM_TOKEN
        sync: false
      - key: AGENT_JWT_SECRET
        sync: false
      - key: AGENT_CONNECTION_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: AGENT_ADMIN_USER_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_CAMPAIGN_MAX_ROWS
        value: "500"
      - key: EMAIL_POLLING_ENABLED
        value: "true"
      - key: EMAIL_POLLING_INTERVAL_MS
        value: "300000"

databases:
  - name: gbolix-ai-agent-db
    plan: basic-256mb
